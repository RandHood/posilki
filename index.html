<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posiłki</title>
<meta name="description" content="Meal suggestions, meal prep and shopping lists for stores in Poland and Iceland.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Posiłki">
<meta name="theme-color" content="#EDF0EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ground:#EDF0EA; --surface:#FAFBF8; --ink:#17231C; --muted:#586A5D; --line:#D2D9CF; --tint:#E1E7DD;
  --beet:#A3174B; --on-beet:#FFFFFF; --dill:#3D6B33; --scrim:rgba(10,16,12,.5);
  --f-head:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1411; --surface:#19211C; --ink:#E7EDE5; --muted:#9AA89D; --line:#2A352E; --tint:#222D26;
    --beet:#E4608A; --on-beet:#2A0A17; --dill:#8FC882; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1411; --surface:#19211C; --ink:#E7EDE5; --muted:#9AA89D; --line:#2A352E; --tint:#222D26;
  --beet:#E4608A; --on-beet:#2A0A17; --dill:#8FC882; --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--beet);outline-offset:2px;border-radius:6px}
h1{font:700 32px/1.1 var(--f-head);letter-spacing:-.02em;margin:0}
h2{font:700 21px/1.2 var(--f-head);margin:0;letter-spacing:-.01em}
h3{font:600 16px/1.3 var(--f-head);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:14px 18px 110px}
.hidden{display:none!important}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25;min-height:48px;padding:6px 18px;border-radius:12px;border:1px solid var(--ink);background:transparent;font-weight:600}
.btn.primary{background:var(--beet);border-color:var(--beet);color:var(--on-beet)}
.btn.sm{min-height:40px;padding:4px 14px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn.danger{border-color:var(--beet);color:var(--beet)}
.btn:disabled{opacity:.4;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.iconbtn{width:44px;height:44px;padding:0;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink);flex:0 0 auto}
.iconbtn.sm{width:36px;height:36px;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:var(--beet)}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.field.big{min-height:56px;font-size:20px}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--tint)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.2;min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:500;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 0 var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.linkbtn{background:none;border:0;padding:10px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* Store badge and picker button */
.sb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--b);color:var(--bt);font:700 15px/1 var(--f-head);flex:0 0 auto}
.sb.lg{width:40px;height:40px;border-radius:11px;font-size:20px}
.storebtn{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.storebtn .grow{flex:1}
.storebtn[aria-pressed="true"]{border-color:var(--beet);box-shadow:inset 0 0 0 1px var(--beet)}
.chev{color:var(--muted);display:inline-grid;place-items:center;vertical-align:middle}
.check{color:var(--beet)}

/* Header and tabs */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.avatar{width:44px;height:44px;padding:0;border-radius:50%;border:0;background:var(--beet);color:var(--on-beet);font:700 18px/1 var(--f-head);display:grid;place-items:center}
.avatar.lg{width:60px;height:60px;font-size:26px}
/* Trim the line box to the capital letter so single initials sit in the optical middle (Safari 18.2+). */
.avatar,.sb{text-box:trim-both cap alphabetic}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 4px;font-size:12px;color:var(--muted);min-height:52px;position:relative}
#tabs button[aria-current="page"]{color:var(--beet);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--beet);color:var(--on-beet);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}

/* Meal images */
.mimg{display:block;width:100%;height:auto;border-radius:14px}
.thumb{width:76px;flex:0 0 76px}
.thumb .mimg{border-radius:10px}

/* Macros */
.macros{width:100%;border-collapse:collapse;margin:12px 0 6px;text-align:center;font-variant-numeric:tabular-nums}
.macros th{font-weight:400;font-size:13px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.macros td{font:700 22px/1.25 var(--f-head);padding:10px 4px 4px}
.macros td small{display:block;font:400 12px var(--f-body);color:var(--muted)}
.mline{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Lists of meals */
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.mrow:last-child{border-bottom:0}
.mrow .grow{flex:1;min-width:0}
.mrow b{display:block;font:600 16px/1.25 var(--f-head)}
.slotlbl{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:12px}
.mcard{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;text-align:left}
.mcard b{font:600 15px/1.25 var(--f-head)}
.mcard span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:18px 0;color:var(--muted);max-width:60ch}

/* Home */
.greet{font:600 22px/1.25 var(--f-head);margin-bottom:16px}
.hblock{padding:18px 0;border-top:1px solid var(--line)}
.hblock:first-of-type{border-top:0;padding-top:0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.notice{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--tint);margin-bottom:18px}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--beet)}

/* Prep: the week is one horizontal row, Monday to Sunday */
.pstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:16px 0 10px}
.pstrip button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:4px 0;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:12px;line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}
.pstrip button b{font:700 17px/1 var(--f-head);color:var(--ink)}
.pstrip button.today b{color:var(--beet)}
.pstrip button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.pstrip button[aria-selected="true"] b{color:var(--ground)}
.pweek{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scroll-padding-inline:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pweek::-webkit-scrollbar{display:none}
.pweek::after{content:"";flex:0 0 6px}
.pday{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.pdhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pdhead span{font-size:14px;color:var(--muted)}
.pday.today .pdhead h2{text-decoration:underline;text-decoration-color:var(--beet);text-decoration-thickness:3px;text-underline-offset:4px}
.pcal{margin-top:4px;font-variant-numeric:tabular-nums}
.pcal b{font:700 17px var(--f-head)}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pitem:last-of-type{border-bottom:0}
.pitem .grow{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.pitem .grow b{display:block;font:600 15px/1.25 var(--f-head)}
.serv{display:inline-flex;align-items:center;gap:2px;margin-top:4px}
.serv button{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--ink)}
.serv span{min-width:74px;text-align:center;font-size:13px;color:var(--muted)}
.pfootrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* Shopping */
.shopgroup{margin:18px 0 0}
.shopgroup > h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shopgroup > h3 small{font:400 13px var(--f-body);color:var(--muted)}
.items{list-style:none;margin:6px 0 0;padding:0}
.item{display:flex;align-items:center;gap:2px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.itemmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:9px 0;text-align:left;min-height:56px}
.box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.item.done .box{background:var(--dill);border-color:var(--dill);color:var(--surface)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;line-height:1.25}
.nm small{display:block;color:var(--muted);font-size:13px}
.item.done .nm b{text-decoration:line-through;color:var(--muted)}
.need{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.need small{display:block;color:var(--muted);font-size:12px}

/* Onboarding */
#onboard{max-width:520px;margin:0 auto;padding:40px 22px calc(40px + env(safe-area-inset-bottom,0px));min-height:100vh;display:flex;flex-direction:column}
.obhead{margin:28px 0 24px}
.obhead p{margin-top:10px;color:var(--muted)}
.obstep{font-size:14px;color:var(--muted)}
.obbody{display:grid;gap:12px}
.obfoot{margin-top:auto;padding-top:28px;display:grid;gap:10px}
.country{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;font:600 20px/1.2 var(--f-head)}
.country .flag{font-size:44px;line-height:1}
.themeopt{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.themeopt b{display:block;font:600 18px/1.2 var(--f-head)}
.themeopt small{color:var(--muted);font-size:14px}
.themeopt[aria-pressed="true"],.country[aria-pressed="true"]{border-color:var(--beet);box-shadow:inset 0 0 0 1px var(--beet)}
.swatch{width:46px;height:46px;border-radius:12px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.swatch i:nth-child(1){background:#EDF0EA}.swatch i:nth-child(2){background:#0F1411}
.swatch.light{display:block;background:#EDF0EA}.swatch.dark{display:block;background:#0F1411}

/* Side panel */
#panelRoot{position:fixed;inset:0;z-index:45;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:auto}
#panelRoot .scrim{opacity:0;transition:opacity .3s ease}
#panelRoot.open .scrim{opacity:1}
#panelRoot:not(.open) .scrim,#panelRoot:not(.open) .panel{pointer-events:none}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--surface);pointer-events:auto;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);box-shadow:-12px 0 32px rgba(0,0,0,.12)}
#panelRoot.open .panel{transform:none}
.storedd{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:10px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;text-align:left}
.storedd .grow{flex:1;min-width:0}
.storedd .grow small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.storedd .grow span{display:block;font-weight:600;line-height:1.25}
.storedd .chev{display:grid;transform:rotate(90deg);transition:transform .25s ease}
.storedd[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.ddwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.ddwrap.open{grid-template-rows:1fr}
.ddwrap > div{overflow:hidden;min-height:0}
.ddlist{display:grid;gap:2px;padding:6px 0 0}
.ddlist button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 10px;border:0;border-radius:10px;background:transparent;text-align:left}
.ddlist button[aria-checked="true"]{background:var(--tint);font-weight:600}
.ddlist button .grow{flex:1}
.me{padding:4px 0 18px;border-bottom:1px solid var(--line)}
.me h2{margin-top:12px}
.me .line{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:15px}
.prow{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.prow .grow{flex:1}
.pthemes{padding:14px 0;border-bottom:1px solid var(--line)}
.pthemes p{font-weight:500;margin-bottom:8px}
.pfoot{margin-top:auto;padding-top:20px;font-size:13px;color:var(--muted)}

/* Full-screen pages */
#overlay{position:fixed;inset:0;z-index:40;background:var(--ground);overflow:auto;padding-top:env(safe-area-inset-top,0px);display:none;-webkit-overflow-scrolling:touch}
#overlay.open{display:block}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0 14px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 0;background:none;border:0;color:var(--beet);font-weight:600}
.section{padding:20px 0;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0;padding-top:4px}
.section > h2{margin-bottom:12px}
.lbl{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
.kcalline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:12px;background:var(--tint);font-variant-numeric:tabular-nums}
.kcalline b{font:700 24px/1.2 var(--f-head)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tgrid label{font-size:13px;color:var(--muted)}
.tgrid input{margin-top:4px;text-align:center;font-variant-numeric:tabular-nums}
.dayblock{padding:14px 0;border-top:1px dashed var(--line)}
.dayblock:first-child{border-top:0}
.dayblock h3{margin-bottom:8px}
.librow{display:flex;gap:12px;align-items:center;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.librow:last-child{border-bottom:0}
.librow .grow{flex:1}
.count{font:700 20px/1.2 var(--f-head);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}

/* Meal page */
.mhead{margin-top:16px}
.mhead .pl{color:var(--muted);margin-top:4px}
.mdesc{margin-top:10px;max-width:60ch}
.mmeta{margin-top:8px;font-size:14px;color:var(--muted)}
.ingrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ingrow:last-child{border-bottom:0}
.ingrow .grow{flex:1;min-width:0}
.ingrow b{display:block;font-weight:600;line-height:1.25}
.ingrow small{display:block;color:var(--muted);font-size:13px}
.gin{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.gin input{width:76px;min-height:40px;padding:0 8px;text-align:right;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.gin span{font-size:14px;color:var(--muted);width:20px}
.ikcal{width:64px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.storeline{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.storeline .storebtn{width:auto;min-height:44px;padding:6px 12px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.recipebtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0;background:none;border:0;text-align:left}
.recipebtn .chev{transition:transform .15s}
.recipebtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.steps{margin:4px 0 0;padding-left:22px}
.steps li{margin:8px 0;padding-left:4px;max-width:60ch}
.video{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;margin-top:12px}
.video .vthumb{position:relative;width:120px;flex:0 0 120px}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play i{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.video b{display:block;font:600 15px/1.3 var(--f-head)}
.video small{color:var(--muted);font-size:13px}

/* Sheets and toast */
#sheetRoot{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom,0px));pointer-events:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.slist{display:grid;gap:8px}
.daypick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.daypick button{min-height:54px;padding:4px 2px;border-radius:12px;border:1px solid var(--line);background:transparent;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.daypick button small{display:block;color:var(--muted);font-size:12px}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.daypick button[aria-pressed="true"] small{color:inherit;opacity:.8}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 36px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.linkbtn svg{vertical-align:-4px;margin-right:4px}
.blockhead .linkbtn{display:inline-flex;align-items:center;text-decoration:none;color:var(--beet);font-weight:600;padding:6px 0}
.blockhead .linkbtn svg{margin-right:6px}
.catshead{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:36px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.catshead .linkbtn{padding:4px 0;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400}
.chips.cats .chip{gap:6px}
.rcount{margin-top:12px;font-size:13px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:99px;background:var(--tint);font-size:13px;font-weight:600;line-height:1}
.storedd .flag,.ddlist .flag{font-size:22px;line-height:1;width:26px;text-align:center;flex:0 0 auto}
</style>

/* ---------- Meal catalog (meals.json) ----------
   The full catalog lives in meals.json so new meals can be added without touching this file.
   The meals above are the offline fallback. A copy of the last catalog is kept on the phone. */
var CAT_KEY='posilki-catalog', CATALOG={loaded:false,updated:null,count:MEALS.length};
function applyCatalog(d){
  if(!d||!isObj(d.ingredients)||!Array.isArray(d.meals)) return false;
  Object.keys(d.ingredients).forEach(function(k){
    var r=d.ingredients[k];
    ING[k]={key:k,pl:r.pl,en:r.en,a:r.aisle,u:r.unit,p:r.p,f:r.f,c:r.c,pack:r.pack,packLabel:r.packLabel,piece:r.piece,col:r.color,shape:r.shape};
    if(r.diet) DIET[k]=r.diet;
    if(isObj(r.products)) Object.keys(r.products).forEach(function(cc){ if(PROD[cc]&&r.products[cc]) PROD[cc][k]=r.products[cc]; });
  });
  var list=d.meals.filter(function(m){ return m&&m.id&&Array.isArray(m.ing)&&Array.isArray(m.types)&&m.ing.every(function(x){return ING[x[0]];}); });
  if(!list.length) return false;
  MEALS=list; MB={}; MEALS.forEach(function(m){MB[m.id]=m;}); catCache={};
  CATALOG={loaded:true,updated:d.updated||null,count:MEALS.length};
  return true;
}
function loadCachedCatalog(){ try{ var raw=localStorage.getItem(CAT_KEY); if(raw) applyCatalog(JSON.parse(raw)); }catch(e){} }
// Resolves true when the catalog changed.
function fetchCatalog(){
  return fetch('meals.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('catalog'); return r.json(); }).then(function(d){
    var changed=!CATALOG.loaded||d.updated!==CATALOG.updated||(d.meals||[]).length!==CATALOG.count;
    if(!applyCatalog(d)) return false;
    try{ localStorage.setItem(CAT_KEY,JSON.stringify(d)); }catch(e){}
    return changed;
  });
}
/* ---------- Store products (products.json) ----------
   A daily GitHub job searches the stores' online shops and writes products.json.
   Stores or ingredients it has not matched fall back to the typical products above. */
var LIVE_KEY='posilki-products', LIVE={updated:null,stores:{}};
function applyProducts(d){
  if(!d||!isObj(d.stores)) return false;
  LIVE={updated:d.updated||null,stores:d.stores};
  return true;
}
function loadCachedProducts(){ try{ var raw=localStorage.getItem(LIVE_KEY); if(raw) applyProducts(JSON.parse(raw)); }catch(e){} }
// Resolves true when the products changed.
function fetchProducts(){
  return fetch('products.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('products'); return r.json(); }).then(function(d){
    var changed=d.updated!==LIVE.updated;
    if(!applyProducts(d)) return false;
    try{ localStorage.setItem(LIVE_KEY,JSON.stringify(d)); }catch(e){}
    return changed;
  });
}
// A store counts as checked only when most ingredients were matched; a handful of matches would mix real and typical products.
function liveStore(store){ var s=LIVE.stores[store]; return s&&isObj(s.items)&&Object.keys(s.items).length>=40?s:null; }
function liveItem(k,store){ var s=liveStore(store); return s&&isObj(s.items[k])&&s.items[k].name?s.items[k]:null; }
function money(v,cur){ return cur==='PLN'?v.toFixed(2).replace('.',',')+' zł':cur==='ISK'?Math.round(v)+' kr':v.toFixed(2)+' '+(cur||''); }
function liveNote(store){
  var s=liveStore(store);
  if(!s) return 'Product names and values are typical examples for '+esc(store)+'. Its online shop can’t be read automatically yet.';
  return 'Products and prices from '+esc(s.source||store)+', checked '+fmtDate(parseIso(s.checked||LIVE.updated).getTime())+'. They are found by search, so check the label in the store.';
}

/* ---------- State, versioning and migration ---------- */
function defTarget(){return {p:120,f:68,c:227};}
function defaults(){
  return {
    v:DATA_VERSION, app:'posilki', onboarded:false,
    profile:{name:'',country:null,store:null},
    theme:'system',
    targets:{mode:'same',same:defTarget(),days:DAYS.map(defTarget)},
    library:{favorites:[],recipes:[],collections:[],weeks:[],lists:[],history:[]},
    shopping:{view:'meal',entries:[]},
    prep:{weekStart:null,days:null},
    lastBackup:null,
    createdAt:Date.now()
  };
}
function fill(def,saved){
  if(!isObj(saved)) return def;
  var out={};
  Object.keys(saved).forEach(function(k){out[k]=saved[k];});
  Object.keys(def).forEach(function(k){
    if(!(k in saved)) out[k]=def[k];
    else if(isObj(def[k])&&isObj(saved[k])) out[k]=fill(def[k],saved[k]);
  });
  return out;
}
// Each data change gets a step here, so updates always keep saved data.
var MIGRATIONS={
  1:function(s){ s.v=2; return s; },
  2:function(s){
    // Targets used to store calories; now calories are worked out from protein, fat and carbs.
    function conv(t){
      if(!isObj(t)) return defTarget();
      if('c' in t) return {p:t.p||0,f:t.f||0,c:t.c||0};
      var c=Math.max(0,Math.round(((t.kcal||2000)-4*(t.p||0)-9*(t.f||0))/4));
      return {p:t.p||0,f:t.f||0,c:c};
    }
    if(isObj(s.targets)){ s.targets.same=conv(s.targets.same); if(Array.isArray(s.targets.days)) s.targets.days=s.targets.days.map(conv); }
    if(!s.theme) s.theme='system';
    if(!isObj(s.prep)||!('days' in s.prep)) s.prep={weekStart:null,days:null};
    if(!isObj(s.shopping)||!Array.isArray(s.shopping.entries)) s.shopping={view:'meal',entries:[]};
    s.v=3; return s;
  },
  3:function(s){
    // Stores without a food catalogue online were removed. Move anyone using one to the first store left.
    if(isObj(s.profile)&&s.profile.store&&s.profile.country&&COUNTRIES[s.profile.country]&&storesFor(s.profile.country).indexOf(s.profile.store)<0){
      MOVED={from:s.profile.store,to:storesFor(s.profile.country)[0]};
      s.profile.store=MOVED.to;
    }
    s.v=4; return s;
  }
};
var MOVED=null;
function migrate(s){
  if(!isObj(s)) return defaults();
  if(!s.v) s.v=1;
  while(s.v<DATA_VERSION && MIGRATIONS[s.v]) s=MIGRATIONS[s.v](s);
  s=fill(defaults(),s);
  if(!Array.isArray(s.targets.days)||s.targets.days.length!==7) s.targets.days=DAYS.map(function(){return clone(s.targets.same);});
  s.v=DATA_VERSION;
  return s;
}
var S=defaults();
function load(){ try{ var raw=localStorage.getItem(KEY); if(raw) S=migrate(JSON.parse(raw)); }catch(e){ S=defaults(); } }
var saveTimer;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,300); }

function tKcal(t){ return 4*t.p+4*t.c+9*t.f; }
function dayTarget(i){ var t=S.targets.mode==='same'?S.targets.same:S.targets.days[i]; return {p:t.p,f:t.f,c:t.c,kcal:tKcal(t)}; }
function backupDue(){ var ref=S.lastBackup||S.createdAt||Date.now(); return Date.now()-ref>14*864e5; }

/* ---------- Meals and macros ---------- */
function allMeals(){ return MEALS.concat(S.library.recipes); }
function getMeal(id){ if(MB[id]) return MB[id]; var r=S.library.recipes; for(var i=0;i<r.length;i++) if(r[i].id===id) return r[i]; return null; }
// Rounded protein, fat and carbs first, then calories from them, so the numbers always add up.
function macrosOf(ing,serv){
  serv=serv||1; var p=0,f=0,c=0,g=0;
  ing.forEach(function(x){var it=ING[x[0]]; if(!it) return; var q=x[1]*serv; p+=it.p*q/100; f+=it.f*q/100; c+=it.c*q/100; g+=q;});
  p=Math.round(p); f=Math.round(f); c=Math.round(c);
  return {p:p,f:f,c:c,kcal:4*p+4*c+9*f,g:Math.round(g)};
}
function sumMacros(list){ var p=0,f=0,c=0; list.forEach(function(m){p+=m.p;f+=m.f;c+=m.c;}); return {p:p,f:f,c:c,kcal:4*p+4*c+9*f}; }
function mealMacros(m,serv){ return macrosOf(m.ing,serv); }
function isFav(id){ return S.library.favorites.indexOf(id)>-1; }
function country(){ return S.profile.country||'PL'; }
function ingName(k){ var x=ING[k]; return country()==='PL'?x.pl:x.en; }
function ingSub(k){ var x=ING[k]; return country()==='PL'?x.en:''; }
function mealTitle(m){ return m.name; }
function mealSub(m){ return country()==='PL'&&m.pl?m.pl:''; }
function round5(g){ return g<5?Math.round(g*10)/10:Math.round(g/5)*5; }
function needText(k,g){ var x=ING[k]; var t=round5(g)+' '+x.u; if(x.piece){ var n=Math.max(1,Math.round(g/x.piece)); t+=' (≈ '+n+(n===1?' pc)':' pcs)'); } return t; }
function packText(k,g,store){
  var x=ING[k], li=liveItem(k,store||S.profile.store);
  if(li&&li.size>0&&li.unit===x.u){
    var m=Math.max(1,Math.ceil(g/li.size-1e-9));
    var sz=li.size>=1000?(Math.round(li.size/100)/10+' '+(li.unit==='ml'?'l':'kg')).replace('.',','):nf(li.size)+' '+li.unit;
    return m+' × '+sz+(li.price>0?', '+money(m*li.price,li.currency):'');
  }
  if(li&&li.price>0) return money(li.price,li.currency)+' each';
  if(x.pack){ var n=Math.max(1,Math.ceil(g/x.pack-1e-9)); return n+' × '+x.packLabel; }
  if(x.piece){ var k=Math.max(1,Math.ceil(g/x.piece-0.15)); return 'sold loose, buy ≈ '+k+(k===1?' pc':' pcs'); }
  return 'sold loose';
}

/* ---------- Meal pictures (drawn from the ingredients) ---------- */
function rng(seed){
  var h=2166136261; for(var i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}
  return function(){ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; };
}
var MIXCOLS=['#EE8A2B','#4E8A3A','#E8542F','#F4D77A','#9CC87A'];
var SHAPE_COUNT={grain:80,crumble:34,curd:46,round:5,coin:6,stick:9,bit:9,floret:6,leaf:9,chunk:7,shred:18,wedge:1,herb:12,slab:1,strip:8,slice:2,egg:5,mound:1,cube:8,bread:2,wrap:1,pasta:24,nut:5,seed:14,sauce:0,bean:14,berry:9,mix:16,none:0};
function lighten(hex,amt){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function darken(hex,amt){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  r=Math.round(r*(1-amt)); g=Math.round(g*(1-amt)); b=Math.round(b*(1-amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function drawShape(shape,col,x,y,R,s){
  var a=Math.round(R()*180), t='transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+a+') scale('+s+')"';
  switch(shape){
    case 'grain': return '<ellipse '+t+' rx="1.4" ry="0.75" fill="'+col+'" stroke="'+darken(col,.12)+'" stroke-width=".25"/>';
    case 'crumble': return '<circle '+t+' r="'+(1.4+R()*0.9).toFixed(2)+'" fill="'+(R()<.5?col:darken(col,.12))+'"/>';
    case 'curd': return '<circle '+t+' r="1.5" fill="'+col+'" stroke="'+darken(col,.08)+'" stroke-width=".3"/>';
    case 'round': return '<g '+t+'><circle r="5" fill="'+col+'"/><circle cx="-1.6" cy="-1.6" r="1.4" fill="'+lighten(col,.35)+'"/></g>';
    case 'coin': return '<g '+t+'><circle r="4.2" fill="'+darken(col,.15)+'"/><circle r="3.3" fill="'+lighten(col,.3)+'"/></g>';
    case 'stick': return '<rect '+t+' x="-1.3" y="-5.5" width="2.6" height="11" rx="1.3" fill="'+col+'"/>';
    case 'bit': return '<rect '+t+' x="-1.4" y="-1.1" width="2.8" height="2.2" rx=".6" fill="'+col+'"/>';
    case 'floret': return '<g '+t+'><rect x="-.8" y="0" width="1.6" height="4" fill="'+lighten(col,.25)+'"/><circle cx="-2" cy="-.5" r="2.4" fill="'+col+'"/><circle cx="2" cy="-.5" r="2.4" fill="'+col+'"/><circle cx="0" cy="-2.4" r="2.6" fill="'+darken(col,.08)+'"/></g>';
    case 'leaf': return '<g '+t+'><ellipse rx="5.2" ry="2.3" fill="'+col+'"/><path d="M-4.5 0H4.5" stroke="'+lighten(col,.3)+'" stroke-width=".4"/></g>';
    case 'chunk': return '<rect '+t+' x="-3.2" y="-2.6" width="6.4" height="5.2" rx="1.6" fill="'+col+'" stroke="'+darken(col,.12)+'" stroke-width=".4"/>';
    case 'shred': return '<rect '+t+' x="-.6" y="-4.5" width="1.2" height="9" rx=".6" fill="'+col+'"/>';
    case 'wedge': return '<g '+t+'><path d="M-5 0A5 5 0 0 1 5 0Z" fill="'+col+'"/><path d="M-3.8 -.3A3.8 3.8 0 0 1 3.8 -.3Z" fill="'+lighten(col,.4)+'"/></g>';
    case 'herb': return '<rect '+t+' x="-.45" y="-1.6" width=".9" height="3.2" rx=".45" fill="'+col+'"/>';
    case 'slab': return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(a%40-20)+') scale('+s+')"><rect x="-12" y="-7" width="24" height="14" rx="6" fill="'+col+'" stroke="'+darken(col,.15)+'" stroke-width=".6"/><path d="M-7 -4l4 8M-1 -4l4 8M5 -4l3 6" stroke="'+darken(col,.22)+'" stroke-width="1" stroke-linecap="round" opacity=".55"/></g>';
    case 'strip': return '<rect '+t+' x="-4.5" y="-1.4" width="9" height="2.8" rx="1.4" fill="'+col+'"/>';
    case 'slice': return '<rect transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(a%30-15)+') scale('+s+')" x="-7" y="-5" width="14" height="10" rx="3.5" fill="'+col+'" stroke="'+darken(col,.15)+'" stroke-width=".5"/>';
    case 'egg': return '<g '+t+'><ellipse rx="4.4" ry="3.4" fill="'+col+'"/><ellipse cx="-1.2" cy="-.8" rx="1.6" ry="1" fill="'+lighten(col,.4)+'"/></g>';
    case 'mound': return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s+')"><ellipse rx="15" ry="11" fill="'+darken(col,.06)+'"/><ellipse cx="-2" cy="-2" rx="12" ry="8" fill="'+col+'"/></g>';
    case 'cube': return '<rect '+t+' x="-1.8" y="-1.8" width="3.6" height="3.6" rx=".6" fill="'+col+'" stroke="'+darken(col,.1)+'" stroke-width=".3"/>';
    case 'bread': return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(a%30-15)+') scale('+s+')"><rect x="-8.5" y="-7.5" width="17" height="15" rx="4" fill="'+col+'"/><rect x="-6.6" y="-5.6" width="13.2" height="11.2" rx="3" fill="'+lighten(col,.25)+'"/></g>';
    case 'wrap': return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(a%40-20)+') scale('+s+')"><rect x="-14" y="-5" width="28" height="10" rx="5" fill="'+col+'" stroke="'+darken(col,.15)+'" stroke-width=".6"/><circle cx="11" cy="0" r="3.2" fill="#78B85A"/><circle cx="11" cy="0" r="1.6" fill="#E7C9A0"/></g>';
    case 'pasta': return '<rect '+t+' x="-3.2" y="-1.1" width="6.4" height="2.2" rx="1.1" fill="'+col+'" stroke="'+darken(col,.15)+'" stroke-width=".3"/>';
    case 'nut': return '<g '+t+'><ellipse rx="2.6" ry="1.9" fill="'+col+'"/><path d="M-1.8 0H1.8" stroke="'+darken(col,.25)+'" stroke-width=".4"/></g>';
    case 'seed': return '<ellipse '+t+' rx="1.5" ry=".75" fill="'+col+'"/>';
    case 'bean': return '<ellipse '+t+' rx="2.3" ry="1.4" fill="'+col+'" stroke="'+lighten(col,.2)+'" stroke-width=".3"/>';
    case 'berry': return '<g '+t+'><circle r="2.7" fill="'+col+'"/><circle cx="-.8" cy="-.8" r=".6" fill="'+lighten(col,.4)+'"/></g>';
    case 'mix': var mc=MIXCOLS[Math.floor(R()*MIXCOLS.length)]; return R()<.5?'<rect '+t+' x="-1.2" y="-4" width="2.4" height="8" rx="1.2" fill="'+mc+'"/>':'<rect '+t+' x="-1.8" y="-1.5" width="3.6" height="3" rx=".8" fill="'+mc+'"/>';
  }
  return '';
}
var TABLE={breakfast:'#EFE2C6',lunch:'#DCE6D2',dinner:'#E4D6DB',snack:'#E1E0EE'};
var imgCache={};
function mealImage(m,label){
  var key=m.id+'|'+m.ing.map(function(x){return x[0];}).join(',');
  if(imgCache[key]) return imgCache[key];
  var R=rng(m.id), cx=80, cy=50, out='';
  var table=TABLE[m.types[0]]||'#E4E6DF';
  out+='<rect width="160" height="100" fill="'+table+'"/>';
  for(var k=0;k<7;k++) out+='<rect x="0" y="'+(k*15+4)+'" width="160" height="1.2" fill="'+darken(table,.05)+'"/>';
  var ings=m.ing.filter(function(x){return ING[x[0]]&&ING[x[0]].shape!=='none';}).slice().sort(function(a,b){return b[1]-a[1];});
  if(m.style==='bowl'){
    var base=ING[m.base]||ING[ings[0][0]];
    out+='<ellipse cx="'+(cx+2)+'" cy="'+(cy+3)+'" rx="42" ry="41" fill="rgba(0,0,0,.08)"/>';
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="41" fill="#F3F1EA"/><circle cx="'+cx+'" cy="'+cy+'" r="34" fill="'+(base.col||'#E9E4D6')+'"/>';
    out+='<circle cx="'+(cx-8)+'" cy="'+(cy-9)+'" r="16" fill="'+lighten(base.col||'#E9E4D6',.18)+'" opacity=".5"/>';
    ings.forEach(function(x){
      var it=ING[x[0]]; if(it===base||it.shape==='sauce'||it.shape==='mound') return;
      var n=Math.max(2,Math.round((SHAPE_COUNT[it.shape]||6)*0.55*(x[1]<20?0.6:1)));
      if(it.shape==='grain'&&m.base==='platki') return;
      for(var i=0;i<n;i++){ var ang=R()*Math.PI*2, rr=Math.sqrt(R())*26; out+=drawShape(it.shape,it.col,cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,R,1.15); }
    });
  } else {
    out+='<ellipse cx="'+(cx+2)+'" cy="'+(cy+3)+'" rx="45" ry="44" fill="rgba(0,0,0,.08)"/>';
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="44" fill="#FBFBF8"/><circle cx="'+cx+'" cy="'+cy+'" r="36" fill="#F3F2EC"/>';
    var sauce=ings.filter(function(x){return ING[x[0]].shape==='sauce';})[0];
    if(sauce) out+='<circle cx="'+cx+'" cy="'+cy+'" r="27" fill="'+ING[sauce[0]].col+'" opacity=".92"/>';
    var mains=ings.filter(function(x){return ING[x[0]].shape!=='sauce'&&x[1]>15;}).slice(0,4);
    var tops=ings.filter(function(x){return ING[x[0]].shape!=='sauce'&&x[1]<=15;});
    var tot=0; mains.forEach(function(x){tot+=Math.sqrt(x[1]);});
    var a0=-Math.PI/2+R()*0.6;
    mains.forEach(function(x){
      var it=ING[x[0]], span=Math.PI*2*Math.sqrt(x[1])/tot, a1=a0+span, mid=(a0+a1)/2;
      var big={slab:1,wrap:1,mound:1,bread:1,slice:1,wedge:1};
      var n=SHAPE_COUNT[it.shape]||6;
      if(big[it.shape]){
        for(var i=0;i<n;i++){ var off=(i-(n-1)/2)*0.38; var rr=it.shape==='mound'?14:17; out+=drawShape(it.shape,it.col,cx+Math.cos(mid+off)*rr,cy+Math.sin(mid+off)*rr,R,mains.length>2?1:1.15); }
      } else {
        for(var j=0;j<n;j++){ var ang=a0+0.12+R()*(span-0.24), r2=7+Math.sqrt(R())*22; out+=drawShape(it.shape,it.col,cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2,R,1.35); }
      }
      a0=a1;
    });
    tops.forEach(function(x){ var it=ING[x[0]], n=Math.max(2,Math.round((SHAPE_COUNT[it.shape]||6)*0.5));
      for(var i=0;i<n;i++){ var ang=R()*Math.PI*2, rr=Math.sqrt(R())*28; out+=drawShape(it.shape,it.col,cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,R,1.1); } });
  }
  var html='<svg class="mimg" viewBox="0 0 160 100" role="img" aria-label="'+esc(label||m.name)+'">'+out+'</svg>';
  imgCache[key]=html; return html;
}
/* ---------- Theme ---------- */
function systemDark(){ try{ return window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; } }
function isDark(){ return S.theme==='dark'||(S.theme!=='light'&&systemDark()); }
function applyTheme(){
  var root=document.documentElement;
  if(S.theme==='light'||S.theme==='dark') root.setAttribute('data-theme',S.theme); else root.removeAttribute('data-theme');
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',isDark()?'#0F1411':'#EDF0EA');
}
function themeSeg(){
  return '<div class="seg" role="group" aria-label="Appearance">'+[['system','System'],['light','Light'],['dark','Dark']].map(function(o){
    return '<button data-a="setTheme" data-theme="'+o[0]+'" aria-pressed="'+(S.theme===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';
}

/* ---------- Planner ---------- */
/* ---------- Categories ----------
   Some come from the numbers (protein, calories, carbs, time, ingredients), the rest from the catalog's tags. */
var CATS=[['protein','High protein'],['light','Low calorie'],['lowcarb','Low carb'],['sweet','Sweet'],['quick','Quick'],['vegetarian','Vegetarian'],['vegan','Vegan'],
  ['fish','Fish & seafood'],['soup','Soups'],['nocook','No cooking'],['mealprep','Meal prep'],['polish','Polish classics'],['icelandic','Icelandic'],['spicy','Spicy']];
var CAT_LABEL={}; CATS.forEach(function(c){CAT_LABEL[c[0]]=c[1];});
var catCache={};
function mealCats(m){
  var key=m.id+'|'+m.ing.map(function(x){return x[0]+x[1];}).join(',');
  if(catCache[key]) return catCache[key];
  var x=mealMacros(m), snack=m.types.every(function(t){return t==='snack';}), out={};
  if(x.p>=(snack?15:25)&&x.p*4>=x.kcal*0.3) out.protein=1;
  if(x.kcal<=(snack?200:400)) out.light=1;
  if(x.c<=(snack?10:20)) out.lowcarb=1;
  if(m.mins<=15) out.quick=1;
  var d=m.ing.map(function(i){return DIET[i[0]]||'';});
  if(d.indexOf('meat')<0&&d.indexOf('fish')<0){ out.vegetarian=1; if(d.indexOf('animal')<0) out.vegan=1; }
  if(d.indexOf('fish')>-1) out.fish=1;
  var base=m.custom?(MB[m.base]||m):m;
  (base.tags||m.tags||[]).forEach(function(t){ if(CAT_LABEL[t]) out[t]=1; });
  var arr=CATS.map(function(c){return c[0];}).filter(function(c){return out[c];});
  catCache[key]=arr; return arr;
}
function hasCats(m,want){ if(!want.length) return true; var c=mealCats(m); return want.every(function(w){return c.indexOf(w)>-1;}); }

function poolFor(t){ return allMeals().filter(function(m){return m.types.indexOf(t)>-1;}); }
function dayTotals(items){ return sumMacros(items.map(function(it){var m=getMeal(it.id);return m?mealMacros(m,it.serv):{p:0,f:0,c:0};})); }
function fit(items,T){
  var order=[3,1,0];
  for(var n=0;n<8;n++){
    var gap=T.kcal-dayTotals(items).kcal, best=null, bestGap=Math.abs(gap);
    if(bestGap<=120) break;
    order.forEach(function(j){
      var it=items[j]; if(!it) return; var m=getMeal(it.id); if(!m) return;
      var step=mealMacros(m,0.5).kcal;
      if(gap>0&&it.serv<2){ var g=Math.abs(gap-step); if(g<bestGap){bestGap=g;best={it:it,d:.5};} }
      if(gap<0&&it.serv>0.5){ var g2=Math.abs(gap+step); if(g2<bestGap){bestGap=g2;best={it:it,d:-.5};} }
    });
    if(!best) break;
    best.it.serv+=best.d;
  }
}
function genDay(i,used){
  var T=dayTarget(i), best=null, bs=1e12;
  for(var n=0;n<300;n++){
    var ids=[], items=[];
    SLOTS.forEach(function(t){
      var arr=poolFor(t).filter(function(m){return ids.indexOf(m.id)<0;});
      var m=arr[Math.floor(Math.random()*arr.length)]; ids.push(m.id); items.push({id:m.id,slot:t,serv:1});
    });
    var tot=dayTotals(items);
    var score=Math.abs(tot.kcal-T.kcal)+Math.max(0,T.p-tot.p)*14;
    items.forEach(function(it){ score+=(used[it.id]||0)*70; if(isFav(it.id)) score-=40; });
    if(score<bs){bs=score;best=items;}
  }
  fit(best,T);
  best.forEach(function(it){used[it.id]=(used[it.id]||0)+1;});
  return best;
}
function newWeek(){
  var used={}, days=[];
  for(var i=0;i<7;i++) days.push(genDay(i,used));
  S.prep={weekStart:mondayIso(),days:days};
}
function ensurePrep(){
  var P=S.prep, ok=P&&P.weekStart===mondayIso()&&Array.isArray(P.days)&&P.days.length===7;
  // Drop meals that no longer exist, but only once the full catalog is here, so nothing planned is lost offline.
  if(ok&&CATALOG.loaded) P.days=P.days.map(function(d){return (d||[]).filter(function(it){return getMeal(it.id);});});
  if(!ok) newWeek();
}
function dayDate(i){ var d=parseIso(S.prep.weekStart); d.setDate(d.getDate()+i); return d; }
function currentSlot(){ var h=new Date().getHours(); return h<10?'breakfast':h<14?'lunch':h<17?'snack':h<21?'dinner':'snack'; }
function startOfToday(){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
// Calories left for this slot: what's left of today's target after meals marked as cooked today,
// split across this slot and the ones still to come.
function slotBudget(slot){
  var T=dayTarget(todayIdx()), t0=startOfToday();
  var cooked=S.library.history.filter(function(h){return h.date>=t0;}).map(function(h){return getMeal(h.mealId);}).filter(Boolean);
  if(!cooked.length) return {kcal:T.kcal*SLOT_SHARE[slot],p:T.p*SLOT_SHARE[slot],T:T,eaten:null};
  var eaten=sumMacros(cooked.map(function(m){return mealMacros(m);}));
  var order=['breakfast','lunch','snack','dinner'], from=order.indexOf(slot), share=0;
  order.forEach(function(s,i){ if(i>=from) share+=SLOT_SHARE[s]; });
  var f=SLOT_SHARE[slot]/(share||1);
  return {kcal:Math.max(80,(T.kcal-eaten.kcal)*f),p:Math.max(0,(T.p-eaten.p)*f),T:T,eaten:eaten};
}
// Scores every meal for the slot, then picks from the best ones with a daily random seed,
// so the list changes from day to day and on every shuffle.
function suggestions(slot,n){
  var B=slotBudget(slot), now=Date.now(), seed=rng(isoDate()+slot+'#'+UI.shuffle);
  var recent={}, aff={};
  S.library.history.forEach(function(h){ if(now-h.date<7*864e5) recent[h.mealId]=1; });
  (S.prep.days&&S.prep.days[todayIdx()]||[]).forEach(function(it){ recent[it.id]=1; });
  S.library.favorites.concat(S.library.history.map(function(h){return h.mealId;})).forEach(function(id){
    var m=getMeal(id); if(m) mealCats(m).forEach(function(c){ aff[c]=(aff[c]||0)+1; });
  });
  var scored=poolFor(slot).filter(function(m){return !m.custom||isFav(m.id);}).map(function(m){
    var x=mealMacros(m), sc=Math.abs(x.kcal-B.kcal)/Math.max(1,B.kcal)*300;
    sc-=Math.min(x.p,B.p*1.3)*2.5;
    if(recent[m.id]) sc+=160;
    if(isFav(m.id)) sc-=50;
    var mc=mealCats(m);
    mc.forEach(function(c){ sc-=Math.min(aff[c]||0,4)*6; });
    // Dishes from the other country still show up, just less often.
    if(mc.indexOf(country()==='PL'?'icelandic':'polish')>-1) sc+=60;
    return {m:m,score:sc+seed()*140};
  }).sort(function(a,b){return a.score-b.score;});
  var pick=[], pool=scored.slice(0,Math.max(n*4,12));
  while(pick.length<n&&pool.length){ var i=Math.floor(Math.pow(seed(),1.6)*pool.length); pick.push(pool.splice(i,1)[0].m); }
  return pick;
}

var TABS=[['home','Home'],['meals','Meals'],['prep','Prep'],['shopping','Shopping']];

/* ---------- Backup ---------- */
function markBackup(){ S.lastBackup=Date.now(); save(); render(); toast('Backup created'); }
function downloadFallback(json,name){
  var blob=new Blob([json],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(url); a.remove();},1500);
  markBackup();
}
function doExport(){
  save();
  var payload={app:'posilki',appVersion:APP_VERSION,dataVersion:DATA_VERSION,exportedAt:new Date().toISOString(),data:S};
  var name='posilki-backup-'+isoDate()+'.json', json=JSON.stringify(payload,null,2), file=null;
  try{ file=new File([json],name,{type:'application/json'}); }catch(e){}
  if(file&&navigator.canShare&&navigator.share){
    var ok=false; try{ ok=navigator.canShare({files:[file]}); }catch(e){}
    if(ok){ navigator.share({files:[file],title:'Posiłki backup'}).then(markBackup).catch(function(err){ if(!err||err.name!=='AbortError') downloadFallback(json,name); }); return; }
  }
  downloadFallback(json,name);
}
function countLib(d){ var L=(d&&d.library)||{}; function n(k){return Array.isArray(L[k])?L[k].length:0;}
  return {favorites:n('favorites'),recipes:n('recipes'),collections:n('collections'),weeks:n('weeks'),lists:n('lists'),history:n('history')}; }
function handleImportFile(file){
  var r=new FileReader();
  r.onload=function(){
    var parsed=null; try{ parsed=JSON.parse(r.result); }catch(e){}
    if(!parsed||parsed.app!=='posilki'||!isObj(parsed.data)){ toast('That file isn’t a Posiłki backup.'); return; }
    UI.pendingImport=parsed;
    var d=parsed.data, c=countLib(d), when=parsed.exportedAt?fmtDate(parsed.exportedAt):'an unknown date';
    openSheet(sheetHead('Import backup','From '+esc(when)+(d.profile&&d.profile.name?', '+esc(d.profile.name):''))+
      '<p>'+[c.favorites+' favorites',c.recipes+' recipes',c.collections+' collections',c.weeks+' saved weeks',c.lists+' saved lists',c.history+' history entries'].join(', ')+', plus your profile, targets, plan and shopping list.</p>'+
      '<p class="note" style="margin-top:10px">Replace swaps everything here for the backup. Merge keeps your current profile, targets and plan and adds anything new from the backup.</p>'+
      '<div class="btnrow"><button class="btn primary" data-a="importReplace">Replace everything</button><button class="btn" data-a="importMerge">Merge</button></div>');
  };
  r.onerror=function(){ toast('Couldn’t read that file.'); };
  r.readAsText(file);
}
function mergeArrays(cur,inc){
  if(!Array.isArray(inc)) return cur;
  var seen={}; cur.forEach(function(x){ seen[typeof x==='string'?x:(x&&x.id)]=1; });
  inc.forEach(function(x){ var k=typeof x==='string'?x:(x&&x.id); if(k&&seen[k]) return; cur.push(x); if(k) seen[k]=1; });
  return cur;
}

  countryToggle:function(){ setCountryOpen(!UI.countryOpen); },
  setCountry:function(el){
    var cc=el.dataset.cc; if(cc===S.profile.country){ setCountryOpen(false); return; }
    UI.countryOpen=false;
    S.profile.country=cc; if(storesFor(cc).indexOf(S.profile.store)<0) S.profile.store=storesFor(cc)[0];
    save(); top().keepScroll=true; renderOverlay(); renderView(); toast('Default store set to '+S.profile.store+'. You can change it below.');
  },
  pickStore:function(el){ openStorePicker(el.dataset.scope); },
  chooseStore:function(el){
    var s=el.dataset.store, sc=UI.sheet&&UI.sheet.scope; closeSheet();
    if(sc==='meal'){ top().store=s; top().keepScroll=true; renderOverlay(); }
    else { S.profile.store=s; save(); top().keepScroll=true; renderOverlay(); renderView(); toast('Default store: '+s); }
  },
  setMode:function(el){
    var m=el.dataset.mode; if(m===S.targets.mode) return;
    if(m==='days') S.targets.days=S.targets.days.map(function(){return clone(S.targets.same);});
    S.targets.mode=m; save(); top().keepScroll=true; renderOverlay();
  },
  copyMonday:function(){ var m=S.targets.days[0]; S.targets.days=DAYS.map(function(){return clone(m);}); save(); top().keepScroll=true; renderOverlay(); toast('Monday copied to every day'); },

  filter:function(el){ UI.filter=el.dataset.f; UI.limit=40; renderView(); },
  cat:function(el){ var c=el.dataset.c, i=UI.cats.indexOf(c); if(i>-1) UI.cats.splice(i,1); else UI.cats.push(c); UI.limit=40; keepX(renderView,'.chips.cats'); },
  clearCats:function(){ UI.cats=[]; UI.limit=40; renderView(); },
  moreMeals:function(){ UI.limit+=40; $('mealResults').innerHTML=mealResults(); },
  shuffle:function(){ UI.shuffle++; renderView(); },
  sugSlot:function(el){ UI.sugSlot=el.dataset.slot; UI.shuffle=0; renderView(); },
  openMeal:function(el){ closeSheet(); openMealPage(el.dataset.id); },
  fav:function(el){ var id=el.dataset.id, i=S.library.favorites.indexOf(id); if(i>-1) S.library.favorites.splice(i,1); else S.library.favorites.push(id); refresh(); toast(i>-1?'Removed from favorites':'Saved to favorites'); },
  toggleRecipe:function(){ var p=top(); p.open=!p.open; p.keepScroll=true; renderOverlay(); },
  resetGrams:function(){ var p=top(), m=getMeal(p.id); p.grams=m.ing.map(function(x){return x[1];}); p.keepScroll=true; renderOverlay(); },
  saveVersion:function(){
    var p=top(), m=getMeal(p.id), ing=pageIng(p);
    if(m.custom){ m.ing=ing; save(); p.grams=ing.map(function(x){return x[1];}); p.keepScroll=true; renderOverlay(); renderView(); toast('Recipe saved'); return; }
    var r=clone(m); r.id='r'+uid(); r.custom=true; r.base=m.id; r.name=m.name+' (my version)'; r.pl=m.pl; r.ing=ing; r.created=Date.now();
    S.library.recipes.push(r); save(); UI.stack[UI.stack.length-1]={type:'meal',id:r.id,store:p.store,grams:ing.map(function(x){return x[1];}),open:p.open};
    renderOverlay(); renderView(); toast('Saved to My recipes');
  },
  mealToList:function(){ var p=top(), m=getMeal(p.id); addEntry(m,pageIng(p),1,null); refresh(); toast(m.name+' added to your shopping list'); },
  addToPlanAsk:openPlanSheet,
  planDay:function(el){ UI.sheet.day=+el.dataset.d; renderPlanSheet(); },
  planSlot:function(el){ UI.sheet.slot=el.dataset.slot; renderPlanSheet(); },
  planConfirm:function(){ var s=UI.sheet; S.prep.days[s.day].push({id:s.id,slot:s.slot,serv:1}); closeSheet(); refresh(); toast('Added to '+DAYS[s.day]); },
  collectionAsk:openCollectionSheet,
  toggleInCollection:function(el){
    var c=S.library.collections.filter(function(x){return x.id===el.dataset.id;})[0], id=UI.sheet.id, i=c.ids.indexOf(id);
    if(i>-1) c.ids.splice(i,1); else c.ids.push(id); save(); openCollectionSheet();
  },
  newCollectionFromMeal:function(){ var v=($('nameInput').value||'').trim(); if(!v) return; S.library.collections.push({id:uid(),name:v,ids:[UI.sheet.id]}); save(); openCollectionSheet(); toast('Added to '+v); },
  cooked:function(){ var m=getMeal(top().id); S.library.history.push({id:uid(),mealId:m.id,date:Date.now()}); save(); toast('Marked as cooked today'); },
  shareMeal:function(){
    var m=getMeal(top().id), url=location.href.split('#')[0]+'#meal-'+m.id;
    if(navigator.share){ navigator.share({title:m.name,text:m.name+' on Posiłki',url:url}).catch(function(){}); return; }
    try{ navigator.clipboard.writeText(url).then(function(){toast('Link copied');},function(){toast(url);}); }catch(e){ toast(url); }
  },

  serv:function(el){ var it=S.prep.days[+el.dataset.d][+el.dataset.j]; it.serv=Math.min(3,Math.max(0.5,it.serv+(+el.dataset.delta))); refresh(); },
  removePlanned:function(el){ S.prep.days[+el.dataset.d].splice(+el.dataset.j,1); refresh(); },
  swapMeal:function(el){
    var d=+el.dataset.d, j=+el.dataset.j, it=S.prep.days[d][j];
    openMealPicker('Swap '+SLOT_LABEL[it.slot].toLowerCase()+' on '+DAYS[d],it.slot,function(id){ it.id=id; it.serv=1; });
  },
  addToDay:function(el){
    var d=+el.dataset.d;
    openMealPicker('Add a meal to '+DAYS[d],null,function(id){ var m=getMeal(id); UI.after={day:d,id:id}; openSlotPicker(d,id); return true; });
  },
  pickMeal:function(el){ var s=UI.sheet; var keep=s.onPick(el.dataset.id); if(!keep){ closeSheet(); refresh(); } },
  pickSlot:function(el){ var s=UI.sheet; S.prep.days[s.day].push({id:s.id,slot:el.dataset.slot,serv:1}); closeSheet(); refresh(); toast('Added to '+DAYS[s.day]); },
  dayToList:function(el){ var d=+el.dataset.d; S.prep.days[d].forEach(function(it){var m=getMeal(it.id); addEntry(m,m.ing,it.serv,d);}); refresh(); toast(DAYS[d]+' added to your shopping list'); },
  weekToList:function(){ var n=0; S.prep.days.forEach(function(items,d){items.forEach(function(it){var m=getMeal(it.id); addEntry(m,m.ing,it.serv,d); n++;});}); refresh(); toast(n+' meals added to your shopping list'); },
  newWeekAsk:function(){ confirmSheet('Plan a new week?','This replaces the meals planned for this week with new suggestions based on your targets.','newWeek','Plan new week'); },
  saveWeekAsk:function(){ openNameSheet('Save this week','e.g. High-protein week','saveWeek','Week of '+fmtShort(dayDate(0))); },
  useWeek:function(el){ var w=S.library.weeks.filter(function(x){return x.id===el.dataset.id;})[0]; S.prep.days=clone(w.days); save(); closeAllPages(); UI.tab='prep'; render(); toast('Using '+w.name); },
  deleteWeek:function(el){ S.library.weeks=S.library.weeks.filter(function(x){return x.id!==el.dataset.id;}); refresh(); },

  shopView:function(el){ S.shopping.view=el.dataset.v; save(); renderView(); },
  shopTog:function(el){ var e=S.shopping.entries.filter(function(x){return x.id===el.dataset.e;})[0]; if(!e) return; var it=e.items.filter(function(x){return x.key===el.dataset.k;})[0]; if(it) it.checked=!it.checked; refresh(); },
  shopTogAll:function(el){ var k=el.dataset.k, all=true; S.shopping.entries.forEach(function(e){e.items.forEach(function(i){if(i.key===k&&!i.checked) all=false;});});
    S.shopping.entries.forEach(function(e){e.items.forEach(function(i){if(i.key===k) i.checked=!all;});}); refresh(); },
  removeEntry:function(el){ S.shopping.entries=S.shopping.entries.filter(function(x){return x.id!==el.dataset.e;}); refresh(); },
  clearChecked:function(){ S.shopping.entries.forEach(function(e){e.items=e.items.filter(function(i){return !i.checked;});}); S.shopping.entries=S.shopping.entries.filter(function(e){return e.items.length;}); refresh(); toast('Checked items removed'); },
  clearListAsk:function(){ confirmSheet('Clear the shopping list?','This removes every item. Save the list to your Library first if you want to reuse it.','clearList','Clear list'); },
  saveListAsk:function(){ openNameSheet('Save shopping list','e.g. Weekly Frisco shop','saveList','Shopping '+fmtShort(new Date())); },
  useList:function(el){ var l=S.library.lists.filter(function(x){return x.id===el.dataset.id;})[0]; S.shopping.entries=clone(l.entries).map(function(e){e.id=uid(); e.items.forEach(function(i){i.checked=false;}); return e;}); save(); closeAllPages(); UI.tab='shopping'; render(); toast('Shopping from '+l.name); },
  deleteList:function(el){ S.library.lists=S.library.lists.filter(function(x){return x.id!==el.dataset.id;}); refresh(); },

  newCollectionAsk:function(){ openNameSheet('New collection','e.g. Quick dinners','newCollection',''); },
  deleteCollection:function(el){ S.library.collections=S.library.collections.filter(function(x){return x.id!==el.dataset.id;}); save(); popPage(); },
  nameSave:function(){
    var v=($('nameInput').value||'').trim(); if(!v) return; var a=UI.sheet.action;
    if(a==='saveWeek'){ S.library.weeks.push({id:uid(),name:v,created:Date.now(),days:clone(S.prep.days)}); toast('Week saved to Library'); }
    else if(a==='saveList'){ S.library.lists.push({id:uid(),name:v,created:Date.now(),entries:clone(S.shopping.entries)}); toast('List saved to Library'); }
    else if(a==='newCollection'){ S.library.collections.push({id:uid(),name:v,ids:[]}); toast('Collection created'); }
    closeSheet(); refresh();
  },
  confirmYes:function(){
    var a=UI.sheet.action; closeSheet();
    if(a==='newWeek'){ newWeek(); refresh(); toast('New week planned'); }
    else if(a==='clearList'){ S.shopping.entries=[]; refresh(); toast('Shopping list cleared'); }
  },

  export:doExport,
  import:function(){ var f=$('importFile'); f.value=''; f.click(); },
  importReplace:function(){
    var p=UI.pendingImport; if(!p) return;
    S=migrate(clone(p.data)); S.onboarded=true; save(); UI.pendingImport=null; closeSheet(); closeAllPages(); render(); toast('Backup restored');
  },
  importMerge:function(){
    var p=UI.pendingImport; if(!p) return; var d=migrate(clone(p.data));
    Object.keys(S.library).forEach(function(k){ S.library[k]=mergeArrays(S.library[k],d.library[k]); });
    S.shopping.entries=mergeArrays(S.shopping.entries,d.shopping.entries);
    save(); UI.pendingImport=null; closeSheet(); render(); toast('Backup merged');
  },
  closeSheet:closeSheet
};

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el||el.disabled||!H[el.dataset.a]) return;
  H[el.dataset.a](el,e);
});
document.addEventListener('input',function(e){
  var t=e.target; if(!t) return;
  if(t.id==='obName'){ UI.ob.name=t.value; var b=$('onboard').querySelector('[data-a="obNext"]'); if(b) b.disabled=!t.value.trim(); return; }
  if(t.id==='setName'){ var v=t.value.trim(); if(v){ S.profile.name=v; saveSoon(); renderTop(); } return; }
  if(t.id==='mealSearch'){ UI.q=t.value; UI.limit=40; $('mealResults').innerHTML=mealResults(); return; }
  if(t.dataset&&t.dataset.gi!=null){ var p=top(), n=parseFloat(t.value); p.grams[+t.dataset.gi]=isNaN(n)||n<0?0:n; updateMealNumbers(); return; }
  if(t.dataset&&t.dataset.t){
    var key=t.dataset.t, obj=key==='same'?S.targets.same:S.targets.days[+key.slice(1)], n2=parseInt(t.value,10);
    obj[t.dataset.f]=isNaN(n2)||n2<0?0:n2;
    var out=$('k-'+key); if(out) out.textContent=nf(tKcal(obj));
    saveSoon();
  }
});
document.addEventListener('scroll',function(e){
  var row=e.target; if(!row||row.id!=='pweek'||!row.firstElementChild) return;
  var w=row.firstElementChild.getBoundingClientRect().width+12, i=Math.max(0,Math.min(6,Math.round(row.scrollLeft/w)));
  if(i!==UI.prepDay){ UI.prepDay=i; markPrepDay(i); }
},true);
document.addEventListener('change',function(e){ if(e.target&&e.target.dataset&&e.target.dataset.t){ renderView(); } });
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='obName'){ H.obNext(); return; }
  if(e.key==='Enter'&&e.target&&e.target.id==='nameInput'&&UI.sheet&&UI.sheet.type==='name'){ H.nameSave(); return; }
  if(e.key!=='Escape') return;
  if($('sheetRoot').innerHTML) closeSheet(); else if(UI.panel) closePanel(); else if(UI.stack.length) popPage();
});
$('importFile').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; if(f) handleImportFile(f); });
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(S.theme==='system') applyTheme(); }); }catch(e){}
window.addEventListener('pagehide',save);
function openFromHash(){
  var h=location.hash||''; if(!S.onboarded||h.indexOf('#meal-')!==0) return;
  var id=decodeURIComponent(h.slice(6)); if(MB[id]&&!(top()&&top().type==='meal'&&top().id===id)) openMealPage(id);
}
window.addEventListener('hashchange',openFromHash);

/* ---------- Start ---------- */
var started=false;
function start(){
  if(started) return; started=true;
  render();
  if(S.onboarded) save();
  openFromHash();
  if(MOVED&&S.onboarded) toast(MOVED.from+' was removed because it has no products online. Your store is now '+MOVED.to+'.');
}
load();
loadCachedCatalog();
loadCachedProducts();
fetchProducts().then(function(changed){ if(changed&&started&&!UI.stack.length&&!UI.sheet&&!UI.panel&&S.onboarded) renderView(); }).catch(function(){});
if(CATALOG.loaded){
  start();
  // Pick up new meals in the background; only redraw if nothing is open on top.
  fetchCatalog().then(function(changed){ if(changed&&!UI.stack.length&&!UI.sheet&&!UI.panel&&S.onboarded) renderView(); }).catch(function(){});
} else {
  // First run: wait briefly for the full catalog, then start with whatever is there.
  fetchCatalog().then(start,start);
  setTimeout(start,4000);
}
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
