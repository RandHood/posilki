name: Deploy to GitHub Pages

# Pages must use Source: GitHub Actions (repo Settings → Pages).
on:
  push:
    branches: [main]
  # Commits made by the store job don't start other workflows, so deploy after it too.
  workflow_run:
    workflows: [Update store products]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest meals.json products.json *.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
