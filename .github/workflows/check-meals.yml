name: Check meals.json

on:
  pull_request:
    paths: ['meals.json', 'scripts/check-meals.mjs', 'app/src/data/ingredients.json']
  push:
    branches: [main]
    paths: ['meals.json', 'scripts/check-meals.mjs', 'app/src/data/ingredients.json']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-meals.mjs
