name: Check app

on:
  pull_request:
    paths: ['app/**', 'meals.json', 'products.json']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm test
          npm run build
